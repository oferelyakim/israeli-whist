name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
  # Lets a failed deploy be retried from the Actions tab without inventing a
  # commit — the deploy step can fail for reasons that have nothing to do with
  # the code (see the Firebase credentials note in CLAUDE.md).
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: whist---elyakim
          # Pinned deliberately. The default is `latest`, and firebase-tools
          # 15.34.x started probing the Service Usage API to check whether
          # Hosting is enabled — a permission the deploy service account does
          # not hold — so the v1.6.0 deploy failed with a 403 on
          # `serviceusage.services.get` while 15.30.2 had worked days earlier.
          # Nothing in this repo or in IAM had changed; the CLI moved.
          # To unpin, first grant the service account
          # roles/serviceusage.serviceUsageConsumer on the GCP project.
          firebaseToolsVersion: 15.30.2
